<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Shop</title>
    <link rel="stylesheet" href="style.css"> 
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Navigation -->

    <nav>
        <h1>🛍️ SmartShop</h1>

        <div class="nav-right">
            <button onclick="toggleDarkMode()" id="darkButton">🌙 Dark Mode</button>
            <span>
                🛒 Cart:
                <span id="cartCount">0</span>
            </span>
        </div>

    </nav>

    <!-- HERO -->

    <section class="hero">

        <h1>Welcome to SmartShop</h1>
        <p>Find your favorite products and the best prices.</p>

    </section>

    <!-- Search/Filter -->

    <section class="search">

        <h2>Products</h2>

        <input type="text" id="searchInput" placeholder="Search your favorite products" onkeyup="searchAndFilter()">
      
        <br><br>

        <select id="priceFilter" onchange="searchAndFilter()">
            <option value="all">All Products</option>
            <option value="under500">Under ₹500</option>
            <option value="500to1000">₹500 - ₹1000</option>
            <option value="1000to2000">₹1000 - ₹2000</option>
            <option value="above2000">Above ₹2000</option>
        </select>

        <select id="categoryFilter" onchange="searchAndFilter()">
            <option value="all">All Categories</option>
            <option value="electronics">Electronics</option>
            <option value="fashion">Fashion</option>
            <option value="home">Home</option>
        </select>

        <div id="products"></div>
    </section>
    
    <!-- Shopping Cart -->

    <section>

        <h2>🛒 Shopping Cart</h2>
        <div id="cart"></div>
        <h3>Total: ₹<span id="cartTotal">0</span></h3>
    </section>

    <button onclick="clearCart()" class="clear-button">Clear Cart</button>
    <button onclick="checkout()" class="clear-button">Checkout</button>
    <!-- Footer -->
    
    <footer>
     <p>© 2026 SmartShop.</p>
    </footer> 

</body>
</html>
